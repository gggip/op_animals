
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>已解鎖動物</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
    h1 { color: #34495e; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin: 20px; }
    .card { position: relative; width: 120px; height: 120px; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2); cursor: pointer; }
    .card img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); transition: filter 0.3s; }
    .card.unlocked img { filter: none; } /* 解鎖後顯示彩色 */
    .card.locked::after {
      content: "未解鎖";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 0.9rem;
      padding: 5px 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>所有動物</h1>
  <div class="gallery" id="gallery">
    <!-- 動物卡片將由 JavaScript 動態生成 -->
  </div>

  <script>
    // 所有動物的數據
    const animals = [
      { id: "gentoo", name: "巴布亞企鵝", img: "https://media.oceanpark.com.hk/files/s3fs-public/Gentoo%20Penguin_2_v2.jpg" },
      { id: "king", name: "國王企鵝", img: "https://media.oceanpark.com.hk/files/s3fs-public/King%20Penguin_1.jpg" },
      { id: "rockhopper", name: "南跳岩企鵝", img: "https://via.placeholder.com/150" }
    ];

    // 從 localStorage 獲取已解鎖的動物
    const unlockedAnimals = JSON.parse(localStorage.getItem('unlockedAnimals')) || [];

    // 動態生成動物卡片
    function displayAnimals() {
      const gallery = document.getElementById("gallery");

      animals.forEach(animal => {
        const card = document.createElement("div");
        card.classList.add("card");

        // 如果動物已解鎖，顯示彩色，否則顯示灰色
        if (unlockedAnimals.includes(animal.id)) {
          card.classList.add("unlocked");
        } else {
          card.classList.add("locked");
        }

        // 卡片內容
        card.innerHTML = `
          <img src="${animal.img}" alt="${animal.name}" title="${animal.name}">
          <p>${animal.name}</p>
        `;
        gallery.appendChild(card);
      });
    }

    // 初始化頁面
    displayAnimals();
  </script>
</body>
</html>
